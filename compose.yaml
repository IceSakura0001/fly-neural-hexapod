name: hexapod-neuro
services:
  console:
    build: .
    image: hexapod-neuro:local
    ports:
      - "127.0.0.1:8765:8000"
    init: true
    restart: unless-stopped
    cpus: 4
    mem_limit: 4g
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      STANCE_SETTINGS_PATH: /app/data/stance-settings.json
    volumes:
      - stance-settings:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  stance-settings:
